schema-version: 1
release-train: 9.9.9-TEST
authority: behavioral-capability
capabilities:
  - id: sample.invalid
    context: test-context
    summary: Compatible capability with implementation tests and syntax evidence alone.
    reference-suite:
      source: public fixture contract
      role: validation fixture only
    native-interface:
      entry-point: example.Invalid#execute
    migration-facade:
      stable: []
      preview: []
    limitations: []
    dependency-gates: []
    promotion-gates: []
    acceptance-profile:
      id: sample-invalid-profile
      state: compatible
      mandatory-evidence:
        - syntax
        - standards
        - semantic
        - visual
      evidence-record: evidence/compatible-profile.md
    evidence:
      - kind: consumer-contract
        path: evidence/implementation.md
        assertion: Implementation tests are present but mandatory Acceptance Evidence is incomplete.
    acceptance-evidence:
      - chain: syntax
        result: pass
        record: evidence/compatible-syntax.md
        producer:
          kind: external-tool
          name: fixture-syntax-validator
          version: "1.0"
    provenance:
      path: PROVENANCE.md
      record: Fixture record
    certified-platforms: []
    status: compatible
