    migration-facade:
      stable: []
      preview: []
    limitations:
      - The fixture intentionally supports one bounded case.
    dependency-gates: []
    promotion-gates: []
    acceptance-profile:
      id: sample-limited-profile
      state: limited
      mandatory-evidence:
        - syntax
        - standards
        - semantic
        - visual
      evidence-record: evidence/limited-profile.md
    evidence:
      - kind: consumer-contract
        path: evidence/implementation.md
        assertion: The fixture has observable implementation evidence.
    acceptance-evidence:
      - chain: syntax
        result: pass
        record: evidence/limited-syntax.md
        producer:
          kind: external-tool
          name: fixture-syntax-validator
          version: "1.0"
      - chain: standards
        result: pass
        record: evidence/limited-standards.md
        producer:
          kind: external-tool
          name: fixture-standards-validator
          version: "1.0"
      - chain: semantic
        result: pass
        record: evidence/limited-semantic.md
        producer:
          kind: project-test
          name: fixture-semantic-assertions
          version: "1.0"
      - chain: visual
        result: pass
        record: evidence/limited-visual.md
        producer:
          kind: external-tool
          name: fixture-visual-renderer
          version: "1.0"
    provenance:
      path: PROVENANCE.md
      record: Fixture record
    certified-platforms: []
    status: limited

