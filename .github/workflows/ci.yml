name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install the explicit T29 native test engine
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends meson ninja-build pkg-config
          source scripts/harfbuzz-pin.properties
          curl --fail --location --output "${RUNNER_TEMP}/${HARFBUZZ_ARCHIVE_NAME}" "${HARFBUZZ_ARCHIVE_URL}"
          python3 scripts/install-harfbuzz.py "${RUNNER_TEMP}/${HARFBUZZ_ARCHIVE_NAME}" "${RUNNER_TEMP}/folio-harfbuzz"
          echo "FOLIO_HARFBUZZ_HELPER=${RUNNER_TEMP}/folio-harfbuzz/bin/folio-harfbuzz" >> "${GITHUB_ENV}"

      - name: Verify
        run: ./mvnw -B -ntp verify
