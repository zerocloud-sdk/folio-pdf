schema-version: 1
sources:
  governing-specification: https://github.com/zerocloud-sdk/folio-pdf/issues/1
  foundation-parent: https://github.com/zerocloud-sdk/folio-pdf/issues/33
  platform-amendment: https://github.com/zerocloud-sdk/folio-pdf/issues/69
  retrieved: 2026-09-08; complete bodies and comments read via gh CLI
requirements:
- id: spec-us-01
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 1
  requirement: As a Java 8 application developer, I want artifacts that genuinely run on Java 8, so that I can migrate
    without upgrading my production JVM.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - java-artifacts
- id: spec-us-02
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 2
  requirement: As a developer on a later JDK, I want the same artifacts tested on JDK 11, 17, and 21, so that runtime
    upgrades do not require a different library line.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - java-artifacts
- id: spec-us-03
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 3
  requirement: As a Maven user, I want all first-party modules available under net.zerocloud and selectable through
    a BOM, so that dependency management is predictable.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - java-artifacts
- id: spec-us-04
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 4
  requirement: As a PDF author, I want to create documents with explicit page sizes, margins, and area breaks, so
    that I can control document structure.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - paragraphs
- id: spec-us-05
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 5
  requirement: As a PDF author, I want mixed-content paragraphs with leading, alignment, indents, tabs, keep behavior,
    and widow/orphan behavior, so that business documents paginate correctly.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - paragraphs
  - pagination
- id: spec-us-06
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 6
  requirement: As a PDF author, I want fixed and automatic tables with row and column spans, so that complex tabular
    documents can be represented.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - tables-base
- id: spec-us-07
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 7
  requirement: As a PDF author, I want repeated table headers and footers, overflow handling, page splitting, relayout,
    and incremental large-table flushing, so that long reports remain usable.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - tables-pagination
- id: spec-us-08
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 8
  requirement: As a multilingual author, I want Latin, Greek, Cyrillic, CJK, Arabic, Hebrew, Devanagari, and Thai
    shaping and layout, so that text is logically and visually correct.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - paragraphs
  - shaping
  - fonts
- id: spec-us-09
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 9
  requirement: As a document generator, I want every barcode generation mode in the iText 7.2.6 Core barcodes module,
    so that existing labels and forms can migrate.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - barcodes-1d
  - barcodes-2d
- id: spec-us-10
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 10
  requirement: As a PDF consumer, I want to open files from paths, streams, channels, and bounded byte sources,
    so that the library fits different application architectures.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - transactions
- id: spec-us-11
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 11
  requirement: As a PDF editor, I want to add, remove, move, and copy pages, so that I can modify existing documents.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - pages
- id: spec-us-12
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 12
  requirement: As a batch processor, I want to merge and split PDFs, so that I can assemble and distribute document
    sets.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - pages
- id: spec-us-13
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 13
  requirement: As an extraction user, I want text, image, page, metadata, and structural extraction, so that downstream
    systems can inspect documents.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - text
  - images
  - metadata
  - pages
- id: spec-us-14
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 14
  requirement: As an advanced PDF developer, I want backend-neutral low-level PDF Values and Object References,
    so that I can perform advanced edits without depending on PDFBox classes.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - values
- id: spec-us-15
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 15
  requirement: As an advanced PDF developer, I want validated Document Patches, so that low-level changes cannot
    bypass lifecycle and preservation rules.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - values
- id: spec-us-16
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 16
  requirement: As an editor, I want unknown objects and resources preserved when safe, so that unrelated content
    is not silently lost.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - pages
  - metadata
  - annotations
  - values
- id: spec-us-17
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 17
  requirement: As an editor, I want an operation rejected when unknown content cannot be preserved safely, so that
    the library never pretends a destructive edit is safe.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - pages
  - metadata
  - annotations
  - values
- id: spec-us-18
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 18
  requirement: As a caller, I want to choose REWRITE or INCREMENTAL explicitly, so that publication semantics are
    not inferred unpredictably.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - transactions
  - incremental
- id: spec-us-19
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 19
  requirement: As a signature-sensitive user, I want signed documents read-only by default, so that edits cannot
    silently invalidate signatures.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - incremental
- id: spec-us-20
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 20
  requirement: As a signature-sensitive user, I want permitted incremental changes only when signature and DocMDP
    rules allow them, so that earlier revisions remain intact.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - incremental
- id: spec-us-21
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 21
  requirement: As a renderer user, I want pages rendered to bounded images with explicit scale, DPI, crop, color,
    and alpha options, so that rendering is deterministic.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - rendering
- id: spec-us-22
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 22
  requirement: As a security-conscious author, I want PDF 1.7 with AES-256 as the default output policy, so that
    obsolete algorithms are not selected accidentally.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - password-baseline
- id: spec-us-23
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 23
  requirement: As a migration user, I want to read supported legacy encryption and explicitly opt into Legacy Security
    Mode for legacy output, so that compatibility does not weaken defaults.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - password-baseline
- id: spec-us-24
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 24
  requirement: As a PDF 2.0 user, I want explicit PDF 2.0 output and PDF 1.0 through 2.0 input support, so that
    version selection is controlled.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - password-baseline
- id: spec-us-25
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 25
  requirement: As a forms developer, I want AcroForm creation, filling, appearance handling, flattening, and XFDF
    support, so that interactive workflows can migrate.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-26
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 26
  requirement: As an XFA user, I want XFA processing behind the Forms context, so that dynamic form workflows can
    be supported in a later dependency-gated phase.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-27
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 27
  requirement: As a Trust user, I want public-key encryption, signing, verification, external signing, HSM, TSA,
    OCSP, CRL, DSS, LTV, and PAdES capabilities, so that document authenticity workflows can migrate.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-28
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 28
  requirement: As an archival specialist, I want PDF/A-1, PDF/A-2, and PDF/A-3 creation checks and independently
    validated outputs, so that archival documents meet the fixed baseline.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-29
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 29
  requirement: As an accessibility specialist, I want tagged and metadata-assisted PDF/UA-1 creation, so that accessible
    output can be produced within the fixed Reference Conformance Set.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-30
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 30
  requirement: As an accessibility reviewer, I want machine and human accessibility evidence kept separate, so that
    automation is not misrepresented as complete accessibility proof.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-31
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 31
  requirement: As an HTML conversion user, I want HTML and CSS transformed through layout, Forms, SVG, and styled
    XML capabilities, so that web content can become PDF.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-32
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 32
  requirement: As an SVG user, I want SVG converted into reusable PDF graphics, so that vector assets remain sharp.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-33
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 33
  requirement: As an OCR user, I want PDF pages rendered, recognized by a selected provider, and rebuilt with a
    searchable text layer, so that scanned PDFs become searchable.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-34
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 34
  requirement: As an Office conversion user, I want Word, Excel, and PowerPoint documents converted through a replaceable
    provider, so that the initial LibreOffice implementation can later be replaced without API changes.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-35
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 35
  requirement: As a sanitization user, I want true removal of sensitive content rather than black rectangles or
    annotations, so that redaction is irreversible.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-36
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 36
  requirement: As an optimization user, I want images, fonts, streams, color spaces, and structures optimized, so
    that file size can be reduced without invalid claims.
  disposition: later-release
  reason: Explicit later dependency-gated Forms, Trust, Conformance, Conversion or Sanitization work; not part of
    Foundation 0.1.0.
  obligations: []
- id: spec-us-37
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 37
  requirement: As an offline operator, I want the default distribution to work without a remote service, so that
    document content remains local.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - providers
- id: spec-us-38
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 38
  requirement: As an integrator, I want OCR, rendering, Office, native shaping, commercial, and remote engines represented
    as Capability Providers, so that deployment and licensing choices are explicit.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - providers
  - shaping
  - rendering
- id: spec-us-39
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 39
  requirement: As a privacy-sensitive operator, I want explicit authorization before content is sent to a remote
    provider, so that document disclosure is never implicit.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - providers
- id: spec-us-40
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 40
  requirement: As a server operator, I want explicit limits for bytes, pages, objects, nesting, decompression, pixels,
    memory, temporary storage, time, and concurrency, so that hostile documents cannot consume unbounded resources.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - limits
  - worker
- id: spec-us-41
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 41
  requirement: As a multi-tenant operator, I want hostile input processed in a Hardened Worker Profile, so that
    a parser failure is isolated from the application process.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - worker
- id: spec-us-42
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 42
  requirement: As a desktop user, I want the same Document Workflow available in-process, so that trusted workloads
    do not pay IPC complexity.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - transactions
  - worker
- id: spec-us-43
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 43
  requirement: As an API user, I want Commands to preserve order and Queries to observe all preceding changes, so
    that workflow behavior is understandable.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - transactions
  - worker
- id: spec-us-44
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 44
  requirement: As an IPC user, I want mutation batching and query barriers, so that the Worker does not require
    one round trip per operation.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - worker
- id: spec-us-45
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 45
  requirement: As an operator, I want uncertain commits resolved through transaction status rather than blind retry,
    so that output is not duplicated.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - recovery
- id: spec-us-46
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 46
  requirement: As an API user, I want stable checked Document Failure codes with safe diagnostics, so that applications
    can handle operational failures without depending on backend exceptions.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - transactions
- id: spec-us-47
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 47
  requirement: As a caller, I want resources opened by the library closed by the library and caller-supplied streams
    left open, so that ownership is predictable.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - transactions
- id: spec-us-48
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 48
  requirement: As a publisher, I want path outputs staged and atomically moved where supported, so that failed workflows
    do not replace good files.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - transactions
- id: spec-us-49
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 49
  requirement: As a multi-output user, I want a Publication Receipt for every target, so that committed, failed,
    and unattempted destinations are explicit.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - transactions
- id: spec-us-50
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 50
  requirement: As a concurrent application, I want a reusable thread-safe Document Workflow and thread-confined
    Sessions, so that separate documents can run in parallel safely.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - transactions
  - recovery
- id: spec-us-51
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 51
  requirement: As an iText migration engineer, I want familiar type and method shapes under net.zerocloud.pdf.itext7,
