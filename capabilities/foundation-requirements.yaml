  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - facade-artifacts
- id: spec-us-52
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 52
  requirement: As an iText migration engineer, I want stable and preview Facades to be mutually exclusive, so that
