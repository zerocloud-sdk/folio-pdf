  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - facade-artifacts
- id: spec-us-53
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 53
  requirement: As an iText migration engineer, I want compile-time surface coverage linked to behavioral evidence,
    so that a compiling method does not imply unsupported behavior.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - facade-artifacts
  - acceptance
- id: spec-us-54
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 54
  requirement: As a migration planner, I want a generated Capability Matrix, so that I can see supported, limited,
    experimental, and planned capabilities.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - docs
- id: spec-us-55
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 55
  requirement: As a migration planner, I want a generated Facade Surface Manifest, so that I can measure source
