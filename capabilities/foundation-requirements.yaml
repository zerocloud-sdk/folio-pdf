  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - docs
- id: spec-us-56
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 56
  requirement: As a user, I want capability-specific tolerances rather than one global pixel threshold, so that
    compatibility criteria fit the behavior being tested.
  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - acceptance
- id: spec-us-57
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 57
  requirement: As a user, I want syntax, standards, semantic, visual, and required human evidence kept as separate
