  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - provenance
- id: spec-us-60
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 60
  requirement: As an implementer, I want closed-product comparisons isolated behind a Compatibility Curator, so
