  disposition: required
  reason: Unchanged Foundation requirement; all assigned obligations remain mandatory.
  obligations:
  - acceptance
- id: spec-us-58
  source: https://github.com/zerocloud-sdk/folio-pdf/issues/1 — User Stories 58
  requirement: As a typography maintainer, I want hash-pinned reference fonts and versioned HarfBuzz profiles on
