# Project-owned T23 public Rendering profile using the existing T19 embedded corpus.
PROFILE_ID=T23-page-rendering-fonts
PAGE_BOX=effective CropBox; CropBox is absent, so MediaBox [0 0 612 792] points is used
DPI=144
COLOR_POLICY=sRGB, opaque 8-bit RGB PNG after compositing over opaque white
FONT_POLICY=only the two embedded project-authored subsets; no system fonts
ANTIALIASING_POLICY=pinned PDFium default text smoothing
BACKGROUND=opaque white (#ffffff)
RASTER_WIDTH=1224
RASTER_HEIGHT=1584
COMPARISON_METRIC=AE
COMPARISON_FUZZ_PERCENT=0
COMPARISON_THRESHOLD=0
RENDERER_AGREEMENT_THRESHOLD=2500
EXPECTED_RASTER=../expected/T19-font-loading-embedding-subsetting-144dpi-srgb.png
EXPECTED_RASTER_SHA256=d5a0c880a7a58bd0de6a1b7e887b6fe6b5a73f14608355434ee8cf022eb04a31

# T23 uses the production Rendering Query and PNG consumer.
SCALE=1
PAGE_SELECTION=1
ALPHA_POLICY=OPAQUE
ANNOTATION_POLICY=SHOW
ROUNDING_POLICY=max(1,floor(binary32(widthInPoints*binary32(dpi/72*scale*UserUnit)))); quarter-turn rotation swaps axes
INPUT_ID_NEUTRAL_SHA256=c476b39cd5106f6270d815aebdcbb38d450ae18d89601da6aa6a02f1bd5c46a7
RENDER_DIAGNOSTICS=[]

