        assertion: Public workflows prove every supported version marker, catalog precedence, deterministic malformed declarations, PDF 1.7 and 2.0 output and transition markers, exact secure and legacy dictionaries, version minima, metadata-clear R4 input, credential lifecycle and independently proven owner authority, every permission bit, mapped authorization, private named-Source snapshots and anti-downgrade policy, protected rewrite, nested reserved-state rejection, encrypted incremental preservation, and encrypted Existing Signature interaction with stable safe failures and NOT_ATTEMPTED receipts.
      - kind: incremental-signature-regression-contract
