schema-version: 1
release-train: 0.1.0-SNAPSHOT
authority: behavioral-capability

capabilities:
  - id: document.blank.create-publish-reopen
    context: document-engine
    summary: Execute a named-source document transaction and publish validated rewrites to named targets.
    reference-suite:
      source: iText Core 7.2.6 document lifecycle
      role: capability inventory only; not an implementation oracle
    native-interface:
      entry-point: net.zerocloud.pdf.DocumentWorkflow#execute
      environment: net.zerocloud.pdf.WorkflowEnvironment
      request: net.zerocloud.pdf.WorkflowRequest
      source: net.zerocloud.pdf.DocumentSource
      command: net.zerocloud.pdf.command.AddBlankPage
      query: net.zerocloud.pdf.query.PageCount
      save-mode: net.zerocloud.pdf.SaveMode
      cancellation: net.zerocloud.pdf.CancellationToken
      progress: net.zerocloud.pdf.WorkflowProgressListener
      outcome: net.zerocloud.pdf.WorkflowOutcome
      execution-profile: net.zerocloud.pdf.WorkflowExecutionProfile
      receipt: net.zerocloud.pdf.PublicationReceipt
      failure: net.zerocloud.pdf.DocumentFailure
    migration-facade:
      stable: []
      preview:
        - itext7.kernel.pdf-writer.constructor-string
        - itext7.kernel.pdf-reader.constructor-string
        - itext7.kernel.pdf-reader.close
        - itext7.kernel.pdf-document.constructor-writer
        - itext7.kernel.pdf-document.constructor-reader
        - itext7.kernel.pdf-document.add-new-page
        - itext7.kernel.pdf-document.get-number-of-pages
        - itext7.kernel.pdf-document.close
        - itext7.kernel.pdf-page.type
        - itext7.kernel.pdf-exception.constructor-message-cause
        - itext7.layout.document.constructor-pdf-document
        - itext7.layout.document.close
    limitations:
      - INCREMENTAL is represented but fails with SAVE_MODE_UNSUPPORTED until T15 implements revision-preserving publication.
      - T03 does not detect or protect signed documents; signed-document read-only enforcement, DocMDP decisions, and signature-safe publication remain T15.
      - T03 opens only the explicitly selected primary source unless an ordered Document Command, such as T10 merge, explicitly selects additional named Sources.
      - Cancellation and deadlines are checked at T03 transaction boundaries; comprehensive hostile-input limits and worker enforcement remain T20 and T21.
    dependency-gates: []
    promotion-gates:
      - ticket: T06
        requirement: Complete the independent acceptance evidence required before compatibility.
    acceptance-profile:
      id: T03-document-workflow-transaction
      state: experimental
      mandatory-evidence:
        - syntax
        - standards
        - semantic
        - visual
      evidence-record: capabilities/evidence/T03-document-workflow-transaction.md
    evidence:
      - kind: consumer-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/consumer/BlankDocumentWorkflowTest.java
        assertion: A public Java 8 consumer creates, publishes, reopens, and observes one page.
      - kind: lifecycle-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/consumer/WorkflowLifecycleTest.java
        assertion: Ordering, callback abort, thread confinement, session expiry, and command ownership are observable.
      - kind: transaction-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/consumer/WorkflowTransactionContractTest.java
        assertion: Named source forms, immutable execution configuration and outcomes, explicit Save Mode, multi-target receipts, validation, cancellation, deadlines, and sanitized progress are observable.
      - kind: resource-ownership-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/consumer/WorkflowResourceOwnershipTest.java
        assertion: Module-opened Path descriptors and caller-owned input, channel, and output resources are checked across the T03 success and failure categories.
      - kind: public-api-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/PublicApiLeakageIT.java
        assertion: Public and protected signatures contain no PDFBox types.
      - kind: artifact-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/JarContractIT.java
        assertion: The jar has the stable module name and Java 8 class-file version.
      - kind: cross-jdk-contract
        path: scripts/verify-jdk-matrix.sh
        assertion: Maven verification runs on JDK 8, 11, 17, and 21.
      - kind: migration-facade-consumer-contract
        path: pdf-migration-itext7-preview/src/test/java/net/zerocloud/pdf/itext7/consumer/PreviewBlankDocumentFacadeTest.java
        assertion: A public preview-facade consumer creates, publishes, reopens, observes one page, receives stable failure codes, and retains Native failure receipts.
      - kind: migration-facade-artifact-contract
        path: pdf-migration-itext7-preview/src/test/java/net/zerocloud/pdf/migration/itext7/contract/JarContractIT.java
        assertion: The stable artifact is a resource-only compatible surface, while the preview Java 8 artifact has the exact mapped surface and is a strict superset of stable mappings.
      - kind: facade-classpath-exclusivity-contract
        path: pdf-migration-itext7-preview/src/test/java/net/zerocloud/pdf/migration/itext7/contract/ClasspathExclusivityIT.java
        assertion: Every mapped public class rejects stable-plus-preview classpaths observably in both jar orders.
      - kind: migration-facade-evidence-record
        path: capabilities/evidence/T04-migration-facades.md
        assertion: T04 scope, behavior, artifact, exclusivity, and evidence boundaries are recorded.
      - kind: acceptance-pipeline-contract
        path: pdf-acceptance/src/test/java/net/zerocloud/pdf/acceptance/AcceptanceEvidenceCommandTest.java
        assertion: Repository-only public-seam checks cover pinned-tool success, failure, warning, mismatch, unavailability, provisioning, and evidence recording.
      - kind: acceptance-command
        path: scripts/acceptance
        assertion: The repository-owned command runs only the isolated Acceptance Evidence profile and writes to an explicit output directory.
      - kind: external-tool-provisioning
        path: scripts/provision-qpdf
        assertion: A local official qpdf archive is verified by SHA-256 and staged outside product artifacts without build-time network access.
      - kind: external-tool-pin
        path: scripts/qpdf-pin.properties
        assertion: The qpdf version, official asset, archive hash, and extracted executable hash have one repository authority.
    acceptance-evidence:
      - chain: syntax
        result: pass
        record: capabilities/evidence/T06-document-blank-syntax.md
        producer:
          kind: external-tool
          name: qpdf
          version: "12.4.0"
      - chain: semantic
        result: pass
        record: capabilities/evidence/T06-document-blank-semantic.md
        producer:
          kind: project-test
          name: folio-pdf-semantic-assertions
          version: 0.1.0-SNAPSHOT
    provenance:
      path: PROVENANCE.md
      record: T06 acceptance-evidence record
    certified-platforms: []
    status: experimental

  - id: document.value.inspect-patch
    context: document-engine
    summary: Inspect all nine backend-neutral PDF Value kinds through bounded Session views and apply validated versioned Document Patches.
    reference-suite:
      source: iText Core 7.2.6 low-level PDF object inspection and mutation surface
      role: capability inventory only; not an implementation or behavioral oracle
    native-interface:
      entry-point: net.zerocloud.pdf.DocumentWorkflow#execute
      patch: net.zerocloud.pdf.DocumentPatch
      object-reference: net.zerocloud.pdf.ObjectReference
      value: net.zerocloud.pdf.PdfValue
      value-kind: net.zerocloud.pdf.PdfValueKind
      inspection-limits: net.zerocloud.pdf.PdfInspectionLimits
      root-query: net.zerocloud.pdf.query.DocumentRootReference
      inspection-query: net.zerocloud.pdf.query.InspectObject
      failure: net.zerocloud.pdf.DocumentFailure
      failure-code: net.zerocloud.pdf.DocumentFailureCode
    migration-facade:
      stable: []
      preview: []
    limitations:
      - T09 applies version-1 dictionary-entry replacements in REWRITE workflows; array-element replacement, entry removal, and broader structural editing operations remain future capability slices.
      - INCREMENTAL remains SAVE_MODE_UNSUPPORTED, and signed-document recognition, DocMDP decisions, and signature-safe changes remain T15.
      - Inspection limits are explicit per-query traversal and decoded-stream bounds; comprehensive hostile-input object, depth, decompression, memory, time, and concurrency enforcement remains T20.
      - T09 runs only through the trusted in-process adapter; the Hardened Worker Profile and its codecs remain T21.
      - Stream patches accept decoded bytes and reject engine-owned encoding metadata; preservation-sensitive filter and incremental stream changes are not claimed.
    dependency-gates:
      - capability: document.blank.create-publish-reopen
        required-status: compatible
    promotion-gates:
      - ticket: T06
        requirement: Complete the independent acceptance evidence required before compatibility.
    acceptance-profile:
      id: T09-document-value-inspection-patch
      state: experimental
      mandatory-evidence:
        - syntax
        - standards
        - semantic
        - visual
      evidence-record: capabilities/evidence/T09-document-value-inspection-patch.md
    evidence:
      - kind: value-patch-consumer-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/consumer/PdfValueWorkflowTest.java
        assertion: Public workflows round-trip all nine PDF Value kinds, including exact decimal numbers, through REWRITE and reopen; retain stable Session references; enforce lazy-view lifecycle and limits; validate each Patch completely before mutation; and reject introduced object-graph cycles plus the complete T09 invalid-Patch matrix with stable safe failures.
      - kind: public-api-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/PublicApiLeakageIT.java
        assertion: Public and protected signatures, including every T09 value, reference, query, and Patch type, contain no PDFBox types.
      - kind: artifact-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/JarContractIT.java
        assertion: The jar retains its stable module name, Java 8 class-file version, notices, and unbundled backend.
      - kind: cross-jdk-contract
        path: scripts/verify-jdk-matrix.sh
        assertion: Maven verification runs the T09 public workflow contract on JDK 8, 11, 17, and 21.
    acceptance-evidence: []
    provenance:
      path: PROVENANCE.md
      record: T09 document-value-inspection-patch record
    certified-platforms: []
    status: experimental

  - id: document.page.manipulate-merge-split
    context: document-engine
    summary: Insert, remove, move, and copy pages; append ordered named Sources; and publish independently reopenable page-range products.
    reference-suite:
      source: iText Core 7.2.6 page tree, copy, merge, and split surface
      role: capability inventory only; not an implementation or behavioral oracle
    native-interface:
      entry-point: net.zerocloud.pdf.DocumentWorkflow#execute
      page-range: net.zerocloud.pdf.PageRange
      insert-page-command: net.zerocloud.pdf.command.InsertBlankPage
      remove-pages-command: net.zerocloud.pdf.command.RemovePages
      move-pages-command: net.zerocloud.pdf.command.MovePages
      copy-pages-command: net.zerocloud.pdf.command.CopyPages
      merge-documents-command: net.zerocloud.pdf.command.MergeDocuments
      split-document-command: net.zerocloud.pdf.command.SplitDocument
      page-reference-query: net.zerocloud.pdf.query.PageObjectReference
      receipt: net.zerocloud.pdf.PublicationReceipt
      failure: net.zerocloud.pdf.DocumentFailure
      failure-code: net.zerocloud.pdf.DocumentFailureCode
    migration-facade:
      stable: []
      preview: []
    limitations:
      - T10 operates in REWRITE workflows; INCREMENTAL remains SAVE_MODE_UNSUPPORTED, and signed-document recognition, DocMDP decisions, and signature-safe changes remain T15.
      - Page operations preserve tested inherited boxes, rotation, resources, basic Text annotations, and content when copied or reparented. Before mutation, T10 rejects nonstructural trailer data, nonempty document information, catalogs or page-tree nodes with unproven entries, inconsistent page-tree parents, counts, cycles, repeated nodes, or any direct input page-tree node, missing effective media boxes, malformed box, rotation, or resource entries, resource graphs that reach page or page-tree structures, nested content arrays, external-file content streams, filtered content streams unless they use one parameter-free FlateDecode or Fl filter with a strictly valid zlib payload, content streams with non-engine metadata, unproven indirect page extensions, separation information, links, widgets, annotation relationships or actions, tagged-page references, and thread beads. Managed document information, XMP metadata, outlines, named destinations, and embedded files are validated, preserved, and retargeted by the document.metadata.outlines-destinations-attachments capability; forms, tagged structure, and annotation action management remain downstream capability slices.
      - Copy, merge, and split preserve semantic page graphs, not source byte layout or backend object identity. Object References are Session-local; public reopen-and-rewrite probes demonstrate that changing an imported content graph leaves its Source and sibling products unchanged.
      - T10 validates command ranges, positions, named merge Sources, and exact split Target coverage. A successful SplitDocument is terminal for Document Commands in that workflow; comprehensive hostile-input page, object, depth, decompression, memory, time, and concurrency enforcement remains T20.
      - T10 runs only through the trusted in-process adapter; the Hardened Worker Profile and its command and query codecs remain T21.
    dependency-gates:
      - capability: document.blank.create-publish-reopen
        required-status: compatible
    promotion-gates:
      - ticket: T06
        requirement: Complete the independent acceptance evidence required before compatibility.
    acceptance-profile:
      id: T10-page-manipulation-merge-split
      state: experimental
      mandatory-evidence:
        - syntax
        - standards
        - semantic
        - visual
      evidence-record: capabilities/evidence/T10-page-manipulation-merge-split.md
    evidence:
      - kind: page-workflow-consumer-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/consumer/PageManipulationWorkflowTest.java
        assertion: Public workflows prove deterministic insert, remove, move, copy, ordered multi-Source merge, range split, preservation of proven-safe page graphs, non-mutating page-reference queries that reject malformed, direct, parent-inconsistent, or count-inconsistent input page-tree nodes while giving every library-created page tree immediate indirect identity, terminal split command ordering, conservative rejection of missing or malformed inherited page attributes, resource graphs that reach page or page-tree structures, nested content arrays, external-file content streams, non-Flate filters, filter arrays, decode parameters, malformed, trailing-data, or preset-dictionary Flate payloads, unproven content-stream metadata, and structurally inconsistent catalog, page-tree, page, and annotation structures before mutation, stable and distinct same-Session indirect-object identities, Source and sibling-product rewrite isolation, stable validation failures, caller-owned Source lifetime and runtime propagation, and complete ordered publication receipts after reopen.
      - kind: public-api-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/PublicApiLeakageIT.java
        assertion: Public and protected signatures, including every T10 command, range, and query type, contain no PDFBox types.
      - kind: artifact-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/JarContractIT.java
        assertion: The jar retains its stable module name, Java 8 class-file version, notices, and unbundled backend.
      - kind: cross-jdk-contract
        path: scripts/verify-jdk-matrix.sh
        assertion: Maven verification runs the T10 public workflow contract on JDK 8, 11, 17, and 21.
    acceptance-evidence:
      - chain: syntax
        result: pass
        record: capabilities/evidence/T10-page-manipulation-merge-split-syntax.md
        producer:
          kind: external-tool
          name: qpdf
          version: "12.4.0"
    provenance:
      path: PROVENANCE.md
      record: T10 page-manipulation-merge-split record
    certified-platforms: []
    status: experimental

  - id: document.metadata.outlines-destinations-attachments
    context: document-engine
    summary: Read, create, update, and preserve document information, XMP metadata, outlines, named destinations, page destinations, and embedded files, with destination retargeting across page reorder, copy, merge, and split.
    reference-suite:
      source: iText Core 7.2.6 document information, XMP, outline, named destination, and embedded file surface
      role: capability inventory only; not an implementation or behavioral oracle
    native-interface:
      entry-point: net.zerocloud.pdf.DocumentWorkflow#execute
      page-destination: net.zerocloud.pdf.PageDestination
      outline-item: net.zerocloud.pdf.OutlineItem
      embedded-file: net.zerocloud.pdf.EmbeddedFile
      embedded-file-summary: net.zerocloud.pdf.EmbeddedFileSummary
      embedded-file-data: net.zerocloud.pdf.EmbeddedFileData
      info-command: net.zerocloud.pdf.command.UpdateDocumentInfo
      xmp-command: net.zerocloud.pdf.command.SetXmpMetadata
      destinations-command: net.zerocloud.pdf.command.SetNamedDestinations
      outline-command: net.zerocloud.pdf.command.ReplaceOutlineTree
      embed-command: net.zerocloud.pdf.command.EmbedFile
      info-query: net.zerocloud.pdf.query.DocumentInfo
      xmp-query: net.zerocloud.pdf.query.XmpMetadata
      destinations-query: net.zerocloud.pdf.query.NamedDestinations
      outline-query: net.zerocloud.pdf.query.OutlineTree
      embedded-files-query: net.zerocloud.pdf.query.EmbeddedFiles
      read-embedded-file-query: net.zerocloud.pdf.query.ReadEmbeddedFile
      failure: net.zerocloud.pdf.DocumentFailure
      failure-code: net.zerocloud.pdf.DocumentFailureCode
    migration-facade:
      stable: []
      preview: []
    limitations:
      - T11 operates in REWRITE workflows; INCREMENTAL remains SAVE_MODE_UNSUPPORTED, and signed-document recognition, DocMDP decisions, and signature-safe changes remain T15.
      - Outlines are written all-open with positive visible-item counts, and name trees are written as one flat array sorted by unsigned encoded key-byte order; richer tree shapes are read only when they satisfy the proven safe invariants, and are otherwise preserved intact or rejected with PRESERVATION_UNSUPPORTED.
      - A page removal that would orphan a managed destination fails with DESTINATION_CONFLICT before mutation; destinations that target pages outside a split selection are dropped from that product, and merge renames colliding destination and embedded-file names with a deterministic -N suffix.
      - Inspection and payload bounds are explicit per-query limits failing with METADATA_LIMIT_EXCEEDED; XMP command packets must be well-formed XML carrying the XMP root marker within a 64 MiB bound, and embedded-file MIME subtypes are restricted to printable ASCII; comprehensive hostile-input object, depth, decompression, memory, time, and concurrency enforcement remains T20, and the Hardened Worker Profile and its codecs remain T21.
      - Annotation and action management remains T12, content extraction remains T13 and T14, and encryption remains T16.
    dependency-gates:
      - capability: document.value.inspect-patch
        required-status: compatible
    promotion-gates:
      - ticket: T06
        requirement: Complete the independent acceptance evidence required before compatibility.
    acceptance-profile:
      id: T11-metadata-outlines-destinations-attachments
      state: experimental
      mandatory-evidence:
        - syntax
        - standards
        - semantic
        - visual
      evidence-record: capabilities/evidence/T11-metadata-outlines-destinations-attachments.md
    evidence:
      - kind: metadata-workflow-consumer-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/consumer/DocumentMetadataWorkflowTest.java
        assertion: Public workflows round-trip document information, bounded XMP packets, outline trees, name-tree destinations, and embedded files through REWRITE and reopen; follow page identity through move, copy, merge, and split; reject destination-orphaning removals with DESTINATION_CONFLICT; reject malformed trees, streams, specifications, and packets with stable safe failures; enforce per-query bounds with METADATA_LIMIT_EXCEEDED; and keep the T10 preflight rejections attributed to the page capability.
      - kind: public-api-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/PublicApiLeakageIT.java
        assertion: Public and protected signatures, including every T11 command, query, and value type, contain no PDFBox types.
      - kind: artifact-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/JarContractIT.java
        assertion: The jar retains its stable module name, Java 8 class-file version, notices, and unbundled backend.
      - kind: cross-jdk-contract
        path: scripts/verify-jdk-matrix.sh
        assertion: Maven verification runs the T11 public workflow contract on JDK 8, 11, 17, and 21.
    acceptance-evidence:
      - chain: syntax
        result: pass
        record: capabilities/evidence/T11-metadata-outlines-destinations-attachments-syntax.md
        producer:
          kind: external-tool
          name: qpdf
          version: "12.4.0"
    provenance:
      path: PROVENANCE.md
      record: T11 metadata-outlines-destinations-attachments record
    certified-platforms: []
    status: experimental

  - id: conversion.capability-provider.select-execute
    context: conversion
    summary: Register, inspect, deterministically select, and safely execute project-owned Capability Providers.
    reference-suite:
      source: Fixed Reference Suite OCR, Office, rendering, and external-engine integration boundaries
      role: capability inventory only; not an implementation or behavioral oracle
    native-interface:
      provider: net.zerocloud.pdf.provider.CapabilityProvider
      catalog: net.zerocloud.pdf.provider.ProviderCatalog
      metadata: net.zerocloud.pdf.provider.ProviderMetadata
      execution-mode: net.zerocloud.pdf.provider.ProviderExecutionMode
      limits: net.zerocloud.pdf.provider.ProviderLimits
      preference: net.zerocloud.pdf.provider.ProviderPreference
      request: net.zerocloud.pdf.provider.ProviderRequest
      result: net.zerocloud.pdf.provider.ProviderResult
      failure: net.zerocloud.pdf.provider.ProviderFailure
      subprocess-adapter: net.zerocloud.pdf.conversion.SubprocessCapabilityProvider
      workflow-environment: net.zerocloud.pdf.WorkflowEnvironment
      workflow-request: net.zerocloud.pdf.WorkflowRequest
      workflow-outcome: net.zerocloud.pdf.WorkflowOutcome
    migration-facade:
      stable: []
      preview: []
    limitations:
      - T05 supplies the Provider contract and a generic bounded subprocess adapter; it does not implement or bundle Tesseract, LibreOffice, HarfBuzz, PDFium, a commercial engine, or a remote service adapter.
      - Provider Operating Limits cover request bytes, result bytes, and elapsed subprocess time; comprehensive document, memory, pixel, concurrency, and hostile-input enforcement remains T20, and the Hardened Worker Profile remains T21.
      - The generic Java 8 subprocess adapter supervises its direct child; descendant process-tree containment and hard isolation remain T21 scope.
      - Provider availability is an immutable registration snapshot; callers rebuild the Workflow Environment when an external engine installation changes.
      - T05 byte-array request and result values are bounded and detached; large-value chunking and worker staging remain outside this ticket.
    dependency-gates:
      - capability: document.blank.create-publish-reopen
        required-status: compatible
    promotion-gates:
      - ticket: T06
        requirement: Complete the independent acceptance evidence required before compatibility.
    acceptance-profile:
      id: T05-capability-provider-contract
      state: experimental
      mandatory-evidence:
        - syntax
        - standards
        - semantic
        - visual
      evidence-record: capabilities/evidence/T05-capability-provider-contract.md
    evidence:
      - kind: provider-contract
        path: pdf-provider-contract/src/test/java/net/zerocloud/pdf/provider/ProviderCatalogTest.java
        assertion: Immutable metadata and payloads, four execution modes, consistent remote metadata, deterministic selection, execution, limits, sanitized adapter failures, and remote-disclosure refusal and authorization are observable at the real Provider seam.
      - kind: workflow-provider-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/consumer/WorkflowCapabilityProviderTest.java
        assertion: Metadata-only discovery, immutable registration, explicit preference, selection information, offline defaults, availability failure, and capability-scoped remote authorization are observable through DocumentWorkflow.execute.
      - kind: subprocess-provider-contract
        path: pdf-conversion/src/test/java/net/zerocloud/pdf/conversion/SubprocessCapabilityProviderTest.java
        assertion: Bounded exchange, input and output limits, deadline termination, startup and runtime failures, malformed output, safe diagnostics, and staging cleanup are observable at the real subprocess Provider seam.
      - kind: provider-public-api-contract
        path: pdf-conversion/src/test/java/net/zerocloud/pdf/conversion/contract/PublicApiLeakageIT.java
        assertion: Public and protected Provider signatures expose only project-owned or JDK types and no PDFBox, process-implementation, or network-client types.
      - kind: provider-artifact-contract
        path: pdf-conversion/src/test/java/net/zerocloud/pdf/conversion/contract/JarContractIT.java
        assertion: Both shipped T05 artifacts have intentional module names, Java 8 class files, notices, no bundled backend, and Release Train BOM entries.
      - kind: cross-jdk-contract
        path: scripts/verify-jdk-matrix.sh
        assertion: Maven verification runs the Provider contract on JDK 8, 11, 17, and 21.
    acceptance-evidence: []
    provenance:
      path: PROVENANCE.md
      record: T05 capability-provider record
    certified-platforms: []
    status: experimental
