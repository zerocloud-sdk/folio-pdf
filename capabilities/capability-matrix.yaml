      outcome: net.zerocloud.pdf.WorkflowOutcome
      receipt: net.zerocloud.pdf.PublicationReceipt
      failure: net.zerocloud.pdf.DocumentFailure
      failure-code: net.zerocloud.pdf.DocumentFailureCode
    migration-facade:
      stable: []
      preview: []
    limitations:
      - Version 1 requires finite nonnegative request or environment bounds for aggregate Source bytes, distinct pages and indirect objects, iterative container/object-graph nesting, supported filter-stage output, materializable decoded pixels, accounted Folio-owned memory, transaction temporary storage, elapsed time, and shared-environment concurrency. Numeric and elapsed boundaries are inclusive; concurrency is a nonblocking admission ceiling. The finite defaults are authoritative in docs/hostile-input-policy.md.
      - One enforcement context spans primary and additional named Sources, Commands, Queries, Document Patches, distinct streams and images, split products, validation, and every publication Target; each applicable counter therefore continues across those phases instead of being recreated. Existing operation-local limits still apply, and the first stricter bound exhausted retains its owning stable failure.
      - Path, stream, channel, and byte-array Sources are copied through actual-byte accounting before parsing. Source snapshots, supported filter spill, temp-only PDFBox cache growth, staged documents and products, and target-adjacent commit staging share one quota and transaction-owned cleanup lifecycle under the configured environment storage policy.
      - Whole-document resource accounting is iterative and runs before caller work and after each Session operation. Malformed page trees, impossible image declarations, and unsupported or malformed filters retain the more specific owning operation's established failure when they do not exhaust a resource policy.
      - Cancellation, absolute deadlines, and elapsed-time checks are cooperative inside project-owned reads, graph, page, metadata, annotation and extraction traversals, backend-cache I/O, Patch, Canvas and positioned-text paths, staging, incremental validation, and publication. A policy failure is terminal even when caller code catches it. Path commitment remains replacement-safe; streams and multiple Targets retain T03 partial-output and non-global-atomicity semantics.
      - Accounted owned memory covers integrated Folio byte lifetimes and working buffers, while PDFBox cache is forced to quota-controlled temporary storage. It is not a JVM-wide, caller-allocation, backend-allocation, native-memory, CPU, or operating-system hard limit and makes no physical secure-erasure claim.
      - T20 itself remains the trusted in-process profile. T21 separately supplies the opt-in Hardened Worker boundary for hostile multi-tenant execution; runtime rendering remains T23.
