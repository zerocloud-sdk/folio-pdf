    summary: Embed, place, and reuse bounded image resources with explicit Device, calibrated, and ICC color plus masks, alpha, blend modes, and Transparency Groups.
    reference-suite:
      source: ISO 32000-1:2008 Image XObject, color-space, mask, graphics-state, blend-mode, Transparency Group, resource, and content-placement concepts
      role: public standards input only; no third-party implementation, image, profile, fixture, or rendered output is an oracle
