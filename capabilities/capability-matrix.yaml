      outcome: net.zerocloud.pdf.WorkflowOutcome
      receipt: net.zerocloud.pdf.PublicationReceipt
      failure: net.zerocloud.pdf.DocumentFailure
    migration-facade:
      stable: []
      preview: []
    limitations:
      - Version 1 appends the reached prefix of a finite list of new unrotated pages. Dimensions are positive and at most 14400 points; nonnegative margins leave a positive box. Areas are explicit rectangles relative to that box or the whole box when omitted. There is no implicit page-template repetition or existing-page-area insertion.
      - Paragraphs contain unshaped Unicode text at explicit sizes and atomic Canvas Transparency Groups scaled to explicit dimensions. Fonts reuse T19 staging, ordered selection, exact integral CID widths, embedding/subsetting and ToUnicode. The T19 closed TrueType profile remains in force; no system or online font discovery or Foundation Noto certification is claimed.
      - Greedy wrapping prefers ASCII spaces and boundaries after graphics, and splits overlong words at Unicode scalar boundaries. Spaces are preserved. LF explicitly ends a line and emits no glyph; other controls and unpaired surrogates are invalid. No bidi, shaping, kerning, language segmentation or hyphenation is performed.
      - LEFT, CENTER and RIGHT align natural advances within the area's width or a paragraph width cap. JUSTIFIED expands nonterminal spaces on automatic nonfinal lines. Lines reserve max(leading, maximum source-font ascent plus descent and graphic height); graphics sit on the baseline. No implicit paragraph spacing is added.
      - All declaration, inline, line and generated page-operator counts are finite. Font limits apply once to the whole flow; Canvas resource limits apply separately to each bounded inline graphic. Transaction-wide page, object, modeled memory, decompression, time and temporary-storage limits still apply. Exhaustion is COMPOSITION_AREA_EXHAUSTED, invalid declarations are COMPOSITION_INVALID, and composition bounds use COMPOSITION_LIMIT_EXCEEDED; dependency failures retain their codes and safe diagnostics.
      - Layout and drawing occur before new pages join the document. Propagated failures leave targets NOT_ATTEMPTED. Commands remain ordered, queries remain barriers, Sessions expire, and caller streams/channels remain caller-owned. Unsigned REWRITE and INCREMENTAL are supported; signature restrictions and password modification plus assembly permission are enforced before caller font acquisition.
      - Worker transport uses the same closed versioned declarations, existing bounded font-source requests, permission preflight, resource ledger, outcome/failure catalogs and verified class inventory. It transports no callbacks or user bytecode.
      - T24 adds no indentation, tabs, keep, widow/orphan, advanced overflow/relayout, tables, Unicode layout, public backend SPI, module cycle, placeholder artifact or Migration Facade stub. The current Preview layout.Document close ownership is not a paragraph mapping.
    dependency-gates:
