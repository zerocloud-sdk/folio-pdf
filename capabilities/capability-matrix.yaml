      stable: []
      preview: []
    limitations:
      - Version 2 is opt-in and preserves version 1 factories and behavior. It admits version 1 or 2 paragraphs but requires version 2 flow and complete limits. No source-breaking public signature change is introduced.
      - Indentation is inside the width cap; nonnegative left/right insets and a signed first-line offset apply once per paragraph. Tab positions are relative to the left inset, with LEFT/CENTER/RIGHT/ANCHOR alignment and a positive repeating grid. Fields are atomic, absent anchors use the right edge, stops never move backwards, and tabbed lines remain left aligned. Tab leaders are excluded.
      - Keep-with-next connects the final line to the next paragraph's first fragment; keep-together requires the whole paragraph in one area. Positive widow/orphan minima apply to every continuation/outgoing fragment, including column boundaries. Rules never relax silently; impossible constraints fail COMPOSITION_CONSTRAINT_UNSATISFIED. An explicit area break conflicts with a pending keep. A final keep is vacuous.
      - WRAP permits scalar fallback inside long words; REJECT moves intact words to fitting areas; VISIBLE preserves complete overlong units beyond horizontal bounds. Graphics and tab fields never split. Vertical overflow always consumes finite declared areas; there is no implicit page repetition, clipping, truncation or lost/duplicated content.
      - Mandatory maximumLayoutAttempts bounds candidate lines and search transitions per command; mandatory maximumRelayouts bounds all attempted relayouts of a buffered flow. Existing line, declaration, font, graphic and content-byte limits remain in force, alongside the Workflow Resource Policy. The search uses an explicit bounded stack and accounted memory.
      - BUFFERED is the version 2 default and retains the current semantic declaration and prepared font selection. Queries preserve eligibility. Relayout replaces only the current unmodified composed tail after complete detached layout and painting; failure preserves the prior content. IMMEDIATE, explicit flush and later successful mutations seal the preceding flow. Flush never publishes early. Unsafe relayout returns COMPOSITION_RELAYOUT_UNSAFE.
      - Publication expires the Session and further operations throw the established IllegalStateException. A reopened PDF contains no retained semantic flow and rejects relayout. Unsigned REWRITE/INCREMENTAL, signature/password permissions, caller font ownership, command ordering, query barriers and Worker resource/transport bounds are preserved.
      - Twelve independent two-page profiles pin page count, full text order, all glyph geometry, fonts, 144 DPI, opaque white sRGB and zero-fuzz AE 0. The secondary renderer bound remains 2500, with exact changed RGB pixels additionally checked against the same bounds. This small project font corpus does not certify Foundation Noto typography or required platforms.
      - T25 adds no table, Unicode layout, shaping, runtime font bundle, backend SPI, module cycle, placeholder artifact or Migration Facade mapping. Standards evidence and compatible-status Dependency Gates remain open.
