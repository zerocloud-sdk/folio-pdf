      save-mode: net.zerocloud.pdf.SaveMode
      outcome: net.zerocloud.pdf.WorkflowOutcome
      receipt: net.zerocloud.pdf.PublicationReceipt
      failure: net.zerocloud.pdf.DocumentFailure
      failure-code: net.zerocloud.pdf.DocumentFailureCode
    migration-facade:
      stable: []
      preview: []
    limitations:
      - Canvas Program version 2 retains the closed version-1 path, clipping, state, and positioned-glyph operations and adds only explicit fill/stroke color, alpha/blend state, image placement, and reusable Transparency Group placement. It accepts no raw operators, caller-defined command, callback, backend/provider object, arbitrary URI, implicit network access, or backend SPI.
      - JPEG accepts bounded 8-bit SOF0/SOF1/SOF2 data with one, three, or four components and preserves exact bytes under DCTDecode; recognized JFIF/Adobe color-transform metadata is explicit and four-component Decode is inverted. PNG uses the platform ImageIO reader and TIFF uses an optional ImageIO reader; each is normalized through BufferedImage.getRGB to 8-bit DeviceRGB Flate samples plus a DeviceGray soft mask only when nonopaque alpha is present. Source precision and non-sRGB color information may be lost. TIFF requires exactly one image. Raw input requires positive geometry, 8 bits per component, a supported color space, and an exact row-major sample length. There is no silent codec or conversion fallback.
      - Existing-image placement borrows only a live same-Session indirect in-file Image XObject with positive dimensions and no filter, one FlateDecode, or one DCTDecode; it preserves the original stream, dictionary, filter/color/Decode/mask metadata, bytes, and Object Reference. Direct, stale/foreign, external-file, chained-filter, JPX, LZW, CCITT, JBIG2, and Crypt resources are rejected rather than copied or transcoded.
      - DeviceGray, DeviceRGB, DeviceCMYK, CalGray, CalRGB, and bounded ICCBased Gray/RGB/CMYK are supported for painting, raw images, and group color. ICC requires exact header length, acsp signature, JDK parser acceptance, and family/component agreement; valid T14 observations include profile Object Reference, decoded byte length, and SHA-256. Malformed and unsupported profiles never expose unverified content or partial output.
      - Explicit masks contain exactly ceil(width/8) bytes per row at one bit per pixel and may invert Decode; soft masks contain exactly one 8-bit opacity byte per pixel. A mask matches its owner and explicit and soft relationships are mutually exclusive. Transparency state supports fill/stroke alpha in [0,1] and the 16 standard blend modes. Groups require a positive finite bounding box, explicit supported color space, version-2 program, isolation/knockout flags, bounded nesting, and no cycle.
      - Every version-2 command declares exact aggregate limits for encoded input bytes, decoded pixels, decoded sample bytes, ICC profile bytes, mask bytes, generated content bytes (including preservation wrappers), distinct resource declarations, and group depth; generated content also has a hard 1 MiB ceiling and group depth has a hard ceiling of 16. Exact boundaries succeed, first excess and overflow fail, and equal image/mask/color-space/profile/state declarations plus repeated placement of the same group instance are charged and materialized once regardless of placement count. T17's 10,000-instruction, graphics-state, existing-content, Font, numeric, and inheritance bounds remain active. These local limits compose with T20's transaction-wide policy and T21 can transport the command through its opt-in Hardened Worker.
      - Existing content and resources must satisfy the T17 preservation preflight and remain in distinct balanced isolation scopes; effective resources are shallow-copied only when necessary and unknown entries remain unchanged. The entire recursive request and all resources are validated before mutation. Unsigned REWRITE and INCREMENTAL are admitted, Existing Signatures reject drawing, password user authority requires general modification permission, and every failure preserves Sources and Targets with NOT_ATTEMPTED receipts and a fixed safe diagnostic.
      - The optional TwelveMonkeys ImageIO TIFF 3.14.0 graph is BSD-3-Clause, unshaded, and marked optional for consumers. Its availability is returned by a project-owned Query and absence produces CANVAS_IMAGE_CODEC_UNAVAILABLE before publication. JPEG/PNG use Java platform APIs. No ImageIO, TwelveMonkeys, or PDFBox implementation type enters the Native Interface.
      - T18 adds no font acquisition, inline-image parsing, patterns, shading, layout, Forms UI, tagging, SVG, redaction, optimization, runtime rendering, Migration Facade surface, or certified-platform claim.
    dependency-gates:
      - capability: document.images-resources.extract
        required-status: compatible
      - capability: composition.canvas.draw-positioned-text
        required-status: compatible
    promotion-gates:
      - ticket: T06
