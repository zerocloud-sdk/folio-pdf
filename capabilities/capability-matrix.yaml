  - id: document.hardened-worker
    context: document-engine
    summary: Execute the fixed-point Document Workflow contract through an authenticated, bounded, process-isolated local Worker while retaining caller callbacks and publication in the parent process.
    reference-suite:
      source: Java SE process, cryptography, permissions, and resource-ownership contracts plus Linux prlimit process-resource controls
      role: public platform contract input only; no third-party implementation, fixture, output, protocol, sandbox profile, or Reference Suite behavior is an oracle
    native-interface:
      entry-point: net.zerocloud.pdf.DocumentWorkflow#execute
      environment: net.zerocloud.pdf.WorkflowEnvironment
      request: net.zerocloud.pdf.WorkflowRequest
      execution-profile: net.zerocloud.pdf.WorkflowExecutionProfile#HARDENED_WORKER
      worker-settings: net.zerocloud.pdf.HardenedWorkerSettings
      command: net.zerocloud.pdf.DocumentCommand
      query: net.zerocloud.pdf.DocumentQuery
      resource-policy: net.zerocloud.pdf.WorkflowResourcePolicy
      outcome: net.zerocloud.pdf.WorkflowOutcome
      receipt: net.zerocloud.pdf.PublicationReceipt
      failure: net.zerocloud.pdf.DocumentFailure
      failure-code: net.zerocloud.pdf.DocumentFailureCode
    migration-facade:
      stable: []
      preview: []
    limitations:
      - HARDENED_WORKER is an explicit per-request choice; IN_PROCESS remains the backward-compatible default. The caller callback and arbitrary caller code remain in the caller process against a thread-confined proxy Document Session, while only library-owned document work crosses the boundary.
      - Version 1 uses a local-only binary protocol with a closed command, query, PDF Value, and result registry fixed to the library-owned set accepted by PdfBoxDocumentSession at the T21 fixed point. Frames carry a version, opcode, monotonic sequence, payload length checked before allocation, and HMAC-SHA-256 tag derived from a fresh 256-bit transaction key delivered only through the inherited protocol stream. Unknown versions, opcodes, classes, Java Serialization data, reflection targets, scripts, URIs, replayed sequences, and malformed or unauthenticated frames fail closed. T22 adds bounded authenticated multi-frame values without opening the registry.
      - Commands preserve declaration order through two closed batch transports. A batch made only of AddBlankPage, InsertBlankPage, CopyPages, MovePages, and RemovePages is eligible for an encoded-length offer while its complete modeled transport peak fits the parent's current message and aggregate owned-memory bounds. That peak is the larger of growable encoder capacity plus retained payload and simultaneous parent/child payload ownership plus the retained/received completion control. It crosses in one atomic frame only when the Worker accepts its current modeled-memory cost. Every other, parent-ineligible, or Worker-deferred batch sends one authenticated declaration fixing the complete ordered count, then sends each indexed preflight, required detail, and Command only when the Worker requests it after its predecessor succeeds. Both forms receive one logical completion. Encoding or materializing later staged Commands is deferred, so execution stops at the first failure without consuming later one-shot inputs or allowing a later resource failure to replace an earlier semantic or backend failure. Execute delegates its singleton batch through the same selection, and each Query is a synchronous ordering barrier. Lazy PDF Value views use bounded authenticated operations, remain serviceable while the Worker awaits a deferred item so they can be used by a later Command, and expire with their proxy Session. Nested PDF Value, outline, and logical-structure codecs are iterative through the public version-1 nesting ceiling. At the T21 fixed point each value fit one configured message; the separate T22 recovery-and-scale capability adds bounded authenticated chunking.
      - The parent snapshots the primary Source before launch under an owner-restricted random transaction root. During Worker initialization, every other named Source is requested, snapshotted, and classified one at a time in declaration order, so an earlier failure does not open a later one-shot Source. The Worker receives only random local handles; the parent retains actual Targets and caller-owned streams or channels and publishes only after a valid finished response and confirmed Worker exit. Reference Font Set entries and explicit Font Sources remain parent-owned and unopened until selected. The selecting Command applies declaration and source-count checks and carries opaque identifiers; the Worker requests each program in declaration order, and the parent applies the aggregate-byte, first-excess, and one-shot reuse rules before returning it in a separate bounded frame. Committed Worker products remain cumulatively charged to the shared temporary-storage ceiling. Existing Save Mode, receipt, partial-stream, replacement, and Provider-selection contracts remain authoritative.
      - The supported launcher is Linux with executable /usr/bin/prlimit, separate unshaded Folio PDF production artifacts or project-only exploded production class directories, and a JDK 8, 11, 17, or 21 runtime capable of installing SecurityManager. It clears the child environment; requires digest-pinned exact first-party class-name inventories and complete-byte SHA-256 matches for every dependency JAR, including an installed optional TIFF closure; rejects mixed, incomplete, extra, multi-release, manifest-extended, delimiter-bearing, or wildcard-bearing classpath entries; fixes heap and direct-memory maxima, stack size, CPU time and open-file count; and denies Worker INET and Unix-domain network, descendant process, link, and filesystem access outside the transaction/runtime roots. Caller-thread checkpoints retain the original environment Clock and deadline authority, while a monotonic watchdog supplies an independent hard Worker-lifetime ceiling and RLIMIT_CPU supplies an independent CPU ceiling. Heap/direct-memory ceilings are not a complete RSS, native-allocation, kernel, or container limit, and no certified-platform or complete OS-sandbox claim is made.
      - Authenticated child STAGED and VALIDATED frames preserve progress boundaries while listener invocation and environment-Clock/deadline checks remain parent-owned and caller-thread-confined. One synchronized parent ledger accounts parent-live allocations and all reported child allocations without a static split. Before every nonempty parent-to-child application frame, the parent reserves and grants its exact payload allocation; the child reserves and releases other decoded or retained allocations through authenticated memory controls; and each quiescent response is followed by an acknowledged empty memory synchronization before the next parent allocation. Atomic-batch eligibility includes the larger of the parent's growable encoder plus retained-payload peak and simultaneous parent/child payload ownership plus the retained/received completion control. Active-context application payloads, decoded String/byte copies, conservatively charged collection capacity, credentials, and normal failure envelopes are cleared or released at their actual lifetime boundaries without sampling the caller Clock on the reader thread. Fixed 12-byte authenticated memory reserve, release, and grant payloads are the sole active control-plane exception and remain outside the ledger to prevent recursive accounting while retaining pre-allocation message-bound checks. Pre-context and post-context failures use a fixed eight-byte allowlisted descriptor, and the fixed eight-byte post-context FINISHED control contains only a version and allowlisted capability token, because no transaction ledger is live. Counts are checked against remaining wire bytes and charged before capacity-bearing allocation. The bootstrap decoder applies the parent-supplied memory ceiling before the child context exists, and decoded initialization collection capacity remains charged for the active transaction after READY; the fixed failure codec remains available as an emergency only when the primary failure has already poisoned or exhausted an active context.
      - Capability Providers remain selected and executed by the parent under their existing operating limits and Remote Disclosure Authorization. No Provider instance, remote connection, private key, arbitrary class, callback, backend object, or executable extension crosses into the Worker. Initialization contains only password-security descriptors and credential-presence flags; credential characters remain parent-side until requested in protocol order, and bounded clearable character and protocol-buffer copies are accounted and cleared on lifecycle boundaries without claiming physical secure erasure.
      - T21 is the base Worker boundary and supplies no remote Worker, public backend SPI, or renderer. The separate T22 recovery-and-scale capability extends this implementation with environment-local identities, lookup, bounded chunking, and controlled scale evidence without changing those exclusions.
    dependency-gates:
      - capability: document.blank.create-publish-reopen
        required-status: compatible
      - capability: document.hostile-input-limits
        required-status: compatible
    promotion-gates:
      - ticket: T06
        requirement: Complete every mandatory independent Acceptance Evidence chain and close both compatible-status Dependency Gates before compatibility; implementation and isolation tests alone are insufficient.
    acceptance-profile:
      id: T21-hardened-worker
      state: experimental
      mandatory-evidence:
        - syntax
        - standards
        - semantic
        - visual
      evidence-record: capabilities/evidence/T21-hardened-worker.md
    evidence:
      - kind: public-worker-workflow-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/consumer/HardenedWorkerWorkflowTest.java
        assertion: Public workflows select the Worker, carry both a memory-negotiated atomic page-structure batch and a declared ordered batch through Worker-requested indexed preflights, details, and items with one logical completion, stop before consuming later one-shot inputs, preserve earlier semantic and backend failures over later transport or resource failures, preserve Query barriers, transport fixed-point command/query/value forms including optional embedded-file values and descriptor-only output policy with on-demand credentials, enforce aggregate transport memory bounds, retain incremental publication, reject caller-defined operations, publish through parent-owned Targets, and report the selected profile.
      - kind: shared-execution-profile-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/consumer/WorkflowExecutionProfileContractTest.java
        assertion: Parameterized public tests hold IN_PROCESS and HARDENED_WORKER to the same ordering, lifecycle, ownership, Save Mode, receipt including post-publication cleanup failure, checked-primary cleanup suppression, progress, cancellation, deadline, caller-thread Clock observation, stable-failure, resource-policy, result-identity, lazy font, exact aggregate font-byte, lossless String-validation, recoverable lazy-view-index and lazy-value-as-command-input behavior, and callback-exception contract. Cross-profile regressions also prove protected-document and signed-Widget failures before later oversized values, Canvas semantic and preservation failures before later image transport, exact once-only Canvas preservation decoding for both command versions, lowered workflow nesting limits for nested transparency, and terminal resource-failure precedence after a callback catches the immediate failure.
      - kind: process-isolation-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/HardenedWorkerIsolationTest.java
        assertion: Real Worker executions prove separate process identity, owner-restricted nondisclosing roots, INET and Unix-domain connect/listen denial, descendant-process denial, denial of reads and writes against marker data in another concurrently live transaction root, hard elapsed termination, target preservation, sequential cleanup, and cleanup after supported exits. Classpath tests prove exact project inventory and dependency-JAR acceptance plus fail-closed rejection of mixed, extra, multi-release, delimiter-bearing, and wildcard-bearing entries and modified dependency JARs.
      - kind: authenticated-protocol-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/WorkerProtocolBoundaryTest.java
        assertion: Tests use the real Worker process boundary to prove exact message and memory-control boundaries, pre-allocation oversized rejection, receive-grant enforcement, aggregate reserve/release synchronization across atomic and indexed wait states, progress acknowledgement, authentication and tamper failure, replay rejection, unknown version and opcode rejection, malformed length and trailing-data rejection, valid-opcode rejection of class, reflection, script, and URI discriminator attempts, Java Serialization rejection, and preservation of every sentinel product.
      - kind: fixed-point-codec-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/WorkerCodecContractTest.java
        assertion: Internal explicit-codec tests prove exact and first-excess full atomic-transport peak eligibility for both dominating peak shapes, a fixed eight-byte allowlisted finished control with an exact first-excess boundary, malformed scalar rejection, indexed later-item message failure, and iterative PDF Value, outline, and logical-structure round trips through the full public nesting ceiling; these are codec unit contracts, not substitutes for real Worker protocol-boundary tests.
      - kind: transport-resource-accounting-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/WorkflowResourceCacheAccountingTest.java
        assertion: Direct resource-context tests prove decoded String/byte reservations are released at their message or returned-request consumer boundaries, decoded credentials are destroyed before releasing their retained-memory reservation, input-resolver ownership closes while the workflow context is still live, decoded collection capacity is charged before allocation with an exact first-excess boundary, a failed recovery keeps the already-observed failure authoritative while making the transaction terminal, closed contexts use only the fixed post-context failure control, and an already exhausted active memory context still reports its authenticated stable failure through the bounded emergency codec.
      - kind: authoritative-contract
        path: docs/hardened-worker.md
        assertion: Selection, callback placement, protocol, ordering, ownership, publication, credentials, Providers, exact classpath authority, supported Linux/JDK envelope, resource and isolation controls, cleanup, stable failures, and the additive T22 recovery-and-scale boundary are documented.
      - kind: dependency-integrity-record
        path: DEPENDENCIES.md
        assertion: The complete-byte SHA-256 authority for every required and optional Worker dependency JAR is recorded without adding, shading, or redistributing a dependency.
      - kind: public-api-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/PublicApiLeakageIT.java
        assertion: Public and protected Worker selection and settings signatures remain Java 8 compatible and expose only project-owned or JDK types.
      - kind: artifact-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/JarContractIT.java
        assertion: The document jar retains its stable module identity, Java 8 class files, notices, and private Worker implementation without a new product module or bundled dependency.
      - kind: cross-jdk-contract
        path: scripts/verify-jdk-matrix.sh
        assertion: Maven verification runs public workflow, protocol, isolation, API, artifact, and regression contracts on JDK 8, 11, 17, and 21.
    acceptance-evidence: []
    provenance:
      path: PROVENANCE.md
      record: T21 hardened-worker record
    certified-platforms: []
    status: experimental

  - id: document.hardened-worker.recovery-scale
    context: document-engine
    summary: Recover safely retryable Hardened Worker failures, resolve uncertain publication without replay, transport bounded values larger than one frame, and record controlled Foundation-scale observations.
    reference-suite:
      source: Java SE identity, digest, resource-ownership, process, and concurrency contracts plus Linux platform observations
      role: public platform contract and controlled implementation evidence only; no third-party implementation, fixture, output, idempotency protocol, or Reference Suite behavior is an oracle
    native-interface:
      entry-point: net.zerocloud.pdf.DocumentWorkflow#execute
      lookup: net.zerocloud.pdf.DocumentWorkflow#lookupTransaction
      environment: net.zerocloud.pdf.WorkflowEnvironment
      transaction-id: net.zerocloud.pdf.WorkflowTransactionId
      transaction-policy: net.zerocloud.pdf.WorkflowTransactionPolicy
      transaction-status: net.zerocloud.pdf.WorkflowTransactionStatus
      transaction-state: net.zerocloud.pdf.WorkflowTransactionState
      request: net.zerocloud.pdf.WorkflowRequest
      resource-policy: net.zerocloud.pdf.WorkflowResourcePolicy
      resource-usage: net.zerocloud.pdf.WorkflowResourceUsage
      outcome: net.zerocloud.pdf.WorkflowOutcome
      receipt: net.zerocloud.pdf.PublicationReceipt
      failure: net.zerocloud.pdf.DocumentFailure
      failure-code: net.zerocloud.pdf.DocumentFailureCode
    migration-facade:
      stable: []
      preview: []
    limitations:
      - Workflow Transaction Identity is optional, bounded, non-secret, and accepted only with HARDENED_WORKER. Status belongs to one Workflow Environment's finite non-evicting in-memory ledger, whose defaults allow 4,096 identities and 64 KiB of modeled request/status/receipt metadata per identity (a 256 MiB aggregate modeled ceiling, not JVM heap or RSS); it is neither durable across environment or process lifetime nor global, distributed, or automatically retried. Count exhaustion or an oversized envelope rejects a new identity before callback or publication; an oversized pre-admission declaration creates no status and may omit receipts rather than copying over-limit metadata. Byte Sources capture a content digest with their defensive copy, and bounded fingerprint work occurs outside the synchronized ledger.
      - An identity binds the material request envelope, including ordered Source and Target declarations, Path locations, byte-source contents, caller-owned resource and credential object identities, Save Mode, output security, and Provider choices. Deadline, cancellation, listener, and resource policy are fresh attempt controls. Because caller callback meaning and mutable Path contents cannot be fingerprinted, the application must preserve their logical meaning across a recoverable retry and must restore the same caller-owned Source stream or channel to its original readable position; an unrepeatable one-shot Source is unsuitable for retry. The ledger retains weak, not owning, identities for streams, channels, outputs, and credentials.
      - Concurrent reuse fails before caller work. A materially different envelope fails with TRANSACTION_IDENTITY_MISMATCH. Only an all-NOT_ATTEMPTED cancellation, deadline, elapsed-time, concurrency, Worker-unavailable, authentication, protocol, or termination failure is RECOVERABLE. COMPLETED and FAILED states are final and repeated submissions fail before callback or publication; Folio PDF never automatically retries.
      - Parent-observed publication progress retains declaration-ordered receipts. Loss of the caller acknowledgement after every Path or stream Target commits resolves as COMPLETED through lookup and cannot replay. Any stream write that may have emitted partial bytes is FAILED with partialOutputPossible and is terminal. Path publication remains ordered and cross-Target atomicity is not claimed.
      - Every physical protocol frame retains its configured payload bound, monotonic sequence, and HMAC. A larger logical value uses a direction-unique transfer identity, declared application opcode, total length, exact chunk count, ordered chunk indexes, and SHA-256 digest. The complete payload plus one maximum-frame receive buffer must pass aggregate modeled-memory admission before allocation; every top-level declaration or chunk reserves that frame scratch before allocation, and a valid transfer reuses the declaration reservation across expected chunks. Missing, reordered, duplicate, corrupt, mismatched, malformed, or excess transfer data fails safely, clears buffers, releases reservations, and cannot mutate an uncommitted Target. This is bounded in-memory chunking, not unbounded streaming or temporary-file staging.
      - Workflow Resource Usage combines parent and authenticated child observations for accepted input, pages, objects, decompression, pixels, peak modeled Folio-owned memory, peak transaction temporary storage, and elapsed time. It is not JVM heap, process RSS, native/backend allocation, operating-system cache, kernel-limit, nesting, or concurrency measurement.
      - Opt-in generated profiles exercise 5,000-page publish/reopen semantics, exact 1-GiB constant-memory clean-room input/staging and cleanup, and admission at configured concurrency two with deterministic first-excess rejection and retry after release. The recorded Linux 6.8.0-136-generic amd64 and GraalVM Community Java 17.0.9 observations are implementation evidence for one platform, not a benchmark, cross-platform result, mandatory independent Acceptance Evidence, or certified-platform claim.
      - T22 adds no remote Worker, durable recovery store, renderer, downstream ticket behavior, public backend SPI, arbitrary extension mechanism, Migration Facade mapping, whole-process memory guarantee, kernel-container certification, physical secure-erasure claim, or cross-Target transaction.
