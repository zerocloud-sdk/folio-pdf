  - id: document.incremental-signature.protect
    context: document-engine
    summary: Append validated PDF revisions while preserving the complete primary Source and conservatively enforcing Existing Signature permissions.
    reference-suite:
      source: ISO 32000-1 incremental-update, signature-field, ByteRange, permissions, and DocMDP contracts
      role: public standards input only; no third-party implementation or signed artifact is an oracle
    native-interface:
      entry-point: net.zerocloud.pdf.DocumentWorkflow#execute
      request: net.zerocloud.pdf.WorkflowRequest
      source: net.zerocloud.pdf.DocumentSource
      command: net.zerocloud.pdf.DocumentCommand
      query: net.zerocloud.pdf.DocumentQuery
      save-mode: net.zerocloud.pdf.SaveMode
      outcome: net.zerocloud.pdf.WorkflowOutcome
      receipt: net.zerocloud.pdf.PublicationReceipt
      failure: net.zerocloud.pdf.DocumentFailure
      failure-code: net.zerocloud.pdf.DocumentFailureCode
    migration-facade:
      stable: []
      preview: []
    limitations:
      - INCREMENTAL requires an existing primary Source, preserves its complete bytes as an unchanged output prefix, appends a non-empty revision, and rejects SplitDocument plus caller-defined or future unclassified commands.
      - Signed Sources are queryable without Targets and cannot be republished with REWRITE. Ordinary signatures and DocMDP P=1 or P=2 authorize no current mutation; only a sole coherent DocMDP P=3 certification policy admits supported non-Widget UpdateAnnotations changes.
      - Recognition validates inherited signature fields, ByteRange bounds, catalog Perms/DocMDP and UR3 entries, transform references, and every applicable restriction by intersection. Structurally valid unsupported handlers and nonzero-first-offset byte ranges remain protected and grant no mutation.
      - Signature-policy inspection is bounded to 4,096 queued field nodes at depth 64, 16 catalog permission entries, 64 entries per signature dictionary, 256 ByteRange entries, 64 signature references, and one indirect-reference resolution at a time; exhaustion or a nested indirect reference fails closed before mutation or publication.
      - T15 recognizes and protects Existing Signatures but does not validate signature digests, certificates, identities, trust chains, revocation, or timestamps; signature creation and cryptographic validation remain T38+.
      - Parsed COS inspection cannot recover duplicate raw dictionary keys, hexadecimal-versus-literal string delimiters, or other lexical details normalized or repaired by PDFBox. T20 bounds the parsed graph and supported decoding, and T21 can contain parsing in the opt-in Hardened Worker, but neither profile restores those raw distinctions.
      - Forms, template instantiation, signature creation, and Widget-field mutation remain T34+; encryption remains T16.
    dependency-gates:
      - capability: document.value.inspect-patch
        required-status: compatible
    promotion-gates:
      - ticket: T06
        requirement: Complete the remaining mandatory independent standards, semantic, and visual evidence and close the prerequisite capability gate before compatibility.
