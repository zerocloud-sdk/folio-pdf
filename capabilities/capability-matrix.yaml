        assertion: Public workflows prove exact Source-prefix retention, non-empty appended revisions, reopen, ordered publication, all Source forms and ownership, missing-Source and closed-command failures, signed query and rewrite policy, ordinary and DocMDP permission decisions, multiple restrictions, P=3 non-Widget annotation changes, malformed and unsupported structures, bounded policy traversal exhaustion, fixed safe failures, NOT_ATTEMPTED receipts, and unchanged Sources and Targets.
      - kind: transaction-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/consumer/WorkflowTransactionContractTest.java
        assertion: Incremental publication retains the existing staging, validation, cancellation, deadline, ordered multi-Target, receipt, and safe-diagnostic transaction contract.
      - kind: public-api-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/PublicApiLeakageIT.java
        assertion: Public and protected signatures expose no PDFBox signature, permission, or incremental-save type.
      - kind: artifact-contract
        path: pdf-document/src/test/java/net/zerocloud/pdf/contract/JarContractIT.java
        assertion: The jar retains its stable module name, Java 8 class-file version, notices, and unbundled backend.
      - kind: cross-jdk-contract
        path: scripts/verify-jdk-matrix.sh
        assertion: Maven verification runs the T15 public workflow contract on JDK 8, 11, 17, and 21.
      - kind: acceptance-command
        path: scripts/acceptance
        assertion: The repository-owned command produces original and appended T15 artifacts through public workflows, checks exact prefix retention and reopen, and records pinned qpdf syntax findings for both unchanged products.
      - kind: acceptance-reproducibility-contract
