  - id: conversion.rendering
    context: conversion
    summary: Render selected current pages to bounded, session-scoped PNGs through a replaceable offline default Provider.
    reference-suite:
      source: Fixed Reference Suite rendering integration boundary and project-owned T23 contract
      role: capability inventory only; not an implementation or behavioral oracle
    native-interface:
      entry-point: net.zerocloud.pdf.DocumentWorkflow#execute
      capability: net.zerocloud.pdf.Rendering
      query: net.zerocloud.pdf.query.RenderPage
      options: net.zerocloud.pdf.RenderOptions
      result: net.zerocloud.pdf.RenderedPage
      diagnostic: net.zerocloud.pdf.RenderDiagnostic
      provider: net.zerocloud.pdf.provider.CapabilityProvider
      environment: net.zerocloud.pdf.WorkflowEnvironment
      resource-policy: net.zerocloud.pdf.WorkflowResourcePolicy
      execution-profile: net.zerocloud.pdf.WorkflowExecutionProfile
    migration-facade:
      stable: []
      preview: []
    limitations:
      - Version 1 renders one current one-based page per Query; the streaming helper preserves selection order and duplicates and closes each result after its caller-thread consumer returns. Earlier completed Commands and font-subset finalization are visible. Streaming is page-at-a-time, not tiled rasterization. PNG staging and byte consumption expire at close or callback completion; detached dimensions and enum diagnostics remain readable.
      - DPI and scale must be positive finite values. MediaBox or effective CropBox and a wholly contained optional unrotated crop determine binary32 geometry. The effective binary32 scale includes UserUnit; dimensions are max(1,floor(binary32(points*scale))) and 90/270-degree rotation swaps axes. Invalid page, options, or address-space overflow have stable explicit failures before raster allocation.
      - RGB and equal-component GRAY use sRGB samples. OPAQUE composites straight alpha over the declared 24-bit background before integer luma conversion; PRESERVE keeps straight alpha and ignores background. PNG is noninterlaced 8-bit RGB/RGBA with an sRGB chunk; compressed byte identity across JVMs is not promised.
      - SHOW renders visible existing normal annotation appearances in viewing intent; HIDE omits annotations. Hidden, NoView, and Invisible flags omit them. Missing appearances report ANNOTATION_APPEARANCE_MISSING. No appearance synthesis is permitted; a rotated NoRotate appearance requiring PDFBox transparency reconstruction fails with RENDER_FAILED. No actions are executed.
      - Nonembedded or damaged fonts and missing glyphs report closed FONT_SUBSTITUTED and GLYPH_SUBSTITUTED diagnostics. Platform JPEG/JPX/JBIG2 codecs, including inline images and masks, report PLATFORM_IMAGE_CODEC; exactly one is permitted as the terminal image filter, and bounded header dimensions must agree with the admitted declaration before platform decoding. Rendering/decode errors are failures. Diagnostics expose no content, names, paths, or backend exceptions. System font substitution is not compatibility evidence; independent font profiles use only pinned embedded project fonts.
      - Every viewport charges width times height cumulatively to the existing shared decoded-pixel ledger in addition to source image charges. Requested ARGB storage, PNG buffers, retained-result metadata, Provider envelopes/copies, and Worker transport are modeled Folio-owned memory over their actual holding periods. This is not total JVM heap, PDFBox/ImageIO internal allocation, native memory, or RSS accounting.
      - PNG and Provider snapshot staging share temporary storage with existing spill and publications. Authenticated child temporary reserve/release grants share the live parent ledger, including retained parent PNGs, without a static split or duplicate charge for borrowed Source snapshots. The existing bounded and chunked Worker protocol carries closed rendering values and still requires a bounded logical payload in modeled memory.
      - Default PDFBox 3.0.8 is private implementation code. Explicit Provider preferences never fall back; unqualified requests try eligible registrations then the reserved folio.pdfbox-renderer. Remote content disclosure requires capability-scoped authorization at selection and execution. External Providers run caller-side in both profiles with a bounded one-page PDF snapshot and the closed FRQ1/FRS1 RGBA envelope; snapshots can contain linked document objects. Provider adapters retain their own time enforcement and isolation obligations.
      - Rendering retains cancellation, deadline, elapsed-time, environment concurrency, extraction-permission, cleanup, signature, and PDF publication contracts. PNG consumption is immediate caller-owned output with possible partial bytes and no Publication Receipt. Escaping rendering failures abort PDF Targets; subsequent PDF publication keeps ordered Path and stream receipt semantics.
      - The independent profiles cover page content plus a normal stamp appearance, the T18 image/color/transparency corpus, and the T19 embedded-font corpus at fixed DPI 144, scale 1, page 1, effective CropBox, opaque white sRGB, and SHOW annotations. Other options have public behavioral tests but no independent visual compatibility claim. T23 adds no OCR, Office conversion, paragraph layout, shaping, Migration Facade surface, or platform certification.
    dependency-gates:
      - capability: conversion.capability-provider.select-execute
        required-status: compatible
      - capability: document.blank.create-publish-reopen
        required-status: compatible
      - capability: document.value.inspect-patch
        required-status: compatible
