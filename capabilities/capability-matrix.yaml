  - id: document.version-password-security
    context: document-engine
    summary: Inspect exact effective PDF versions, publish PDF 1.7 or 2.0, and authenticate and enforce bounded Standard-handler password security with AES-256 defaults.
    reference-suite:
      source: ISO 32000-1:2008 and ISO 32000-2:2020 version, Standard security-handler, crypt-filter, credential, permission, and extension contracts
      role: public standards input only; no third-party implementation or protected artifact is an oracle
    native-interface:
      entry-point: net.zerocloud.pdf.DocumentWorkflow#execute
      request: net.zerocloud.pdf.WorkflowRequest
      source: net.zerocloud.pdf.DocumentSource
      output-policy: net.zerocloud.pdf.PdfOutputPolicy
      version: net.zerocloud.pdf.PdfVersion
      version-info: net.zerocloud.pdf.PdfVersionInfo
      version-query: net.zerocloud.pdf.query.DocumentVersion
      password-credential: net.zerocloud.pdf.PasswordCredential
      password-security-policy: net.zerocloud.pdf.PasswordSecurityPolicy
      password-security-info: net.zerocloud.pdf.PasswordSecurityInfo
      password-encryption-algorithm: net.zerocloud.pdf.PasswordEncryptionAlgorithm
      password-encryption-scope: net.zerocloud.pdf.PasswordEncryptionScope
      document-permissions: net.zerocloud.pdf.DocumentPermissions
      credential-authority: net.zerocloud.pdf.CredentialAuthority
      legacy-security-mode: net.zerocloud.pdf.LegacySecurityMode
      security-query: net.zerocloud.pdf.query.DocumentSecurity
      outcome: net.zerocloud.pdf.WorkflowOutcome
      receipt: net.zerocloud.pdf.PublicationReceipt
      failure: net.zerocloud.pdf.DocumentFailure
      failure-code: net.zerocloud.pdf.DocumentFailureCode
    migration-facade:
      stable: []
      preview: []
    limitations:
      - Input versions are the exact header and optional catalog declarations for PDF 1.0 through 1.7 and 2.0; PDF 1.x begins at byte zero while PDF 2.0 may follow a preamble within the 1,024-byte inspection bound. Missing, malformed, or unsupported declarations fail closed, and effective version is the later declaration.
      - REWRITE output defaults to PDF 1.7 and supports explicit PDF 1.7 or PDF 2.0 only. A PDF 2.0 primary or named Source requires explicit PDF 2.0 REWRITE because no downgrade proof exists; INCREMENTAL may preserve but cannot change the effective primary Source version.
      - Secure password output is Standard-handler V=5, R=6, AESV3 with 256-bit keys and whole-document metadata encryption. PDF 1.7 output carries the qualified ADBE Extension Level 8 convention; PDF 2.0 output uses the normative R6 profile and requires permission bit 10 set.
      - Legacy Security Mode is request-scoped. It permits only RC4-128 V=2/R=3 or AES-128 V=4/R=4 output on PDF 1.7; RC4-40 output, V=4 RC4 output, and R=5 output are unsupported.
      - Accepted legacy inputs are V=1/R=2 or R=3 RC4-40, V=2/R=3 RC4-128, and whole-document V=4/R=4 RC4-128 or AES-128. R=5, public-key handlers, unknown crypt filters, malformed authentication entries, attachment-only encryption, and inconsistent R6 Perms fail closed.
      - Output models all-content, metadata-clear, and attachment-only scopes but the current backend supports only all-content output. Fixture-proven metadata-clear V=4/R=4 input may be read; metadata-clear AES-256 and attachment-only input are not claimed.
      - Output owner and user credentials must be distinct, non-empty printable ASCII, at most 127 characters for AES-256 and 32 for legacy profiles. This deliberately rejects backend normalization, truncation, and legacy encoding ambiguity.
      - PasswordCredential owns destroyable defensive char-array copies, but PDFBox requires temporary immutable String values; Folio cannot guarantee erasure of backend or JVM copies and makes no physical secure-erasure claim.
      - "Owner authority bypasses the permission word; user authority is checked before every mapped command or content-bearing query. Folio separately applies the Standard-handler owner predicate when the permission word is unrestricted: proven owners report OWNER, while unrestricted users remain UNRESTRICTED and cannot perform owner-only protected REWRITE."
      - Password permissions are cooperative processor restrictions rather than cryptographic DRM. Printing and form filling have no current workflow commands, so those bits round-trip without an execution claim.
      - A protected Source cannot be implicitly rewritten as plaintext or rekeyed by user authority. Protected INCREMENTAL publication preserves encryption and still intersects T15 Existing Signature rules; explicit security changes in INCREMENTAL are unsupported.
      - Every declared non-primary Source is authenticated and strictly classified before caller work using a workflow-owned temporary snapshot that preserves one-shot stream/channel ownership. Published donors cannot downgrade effective version, algorithm, or encryption scope; donor extraction permission remains a merge-command gate.
      - DocumentPatch cannot change catalog Version or Extensions, an exposed encryption dictionary, or trailer Encrypt state. Page operations preserve only the exact ADBE Extension Level 8 declaration owned by T16 and reject additional or malformed extension state.
      - Public-key encryption, FIPS validation, and signature creation or trust validation remain T37 and T38+ scope. T20's cooperative transaction policy applies in-process, and T21 can transport this same password-security contract through its opt-in Hardened Worker.
