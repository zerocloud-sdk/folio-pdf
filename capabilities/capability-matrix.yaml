  - id: document.hostile-input-limits
    context: document-engine
    summary: Apply one finite-default, transaction-wide hostile-input resource policy to trusted in-process Document Workflows.
    reference-suite:
      source: ISO 32000-1:2008 document, object, stream-filter, page, and image resource concepts plus Java SE time, concurrency, and storage contracts
      role: public specification input only; no third-party implementation, fixture, output, or resource profile is an oracle
    native-interface:
